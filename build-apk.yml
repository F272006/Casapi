name: Build Casapi APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Create Android project
        run: npx cap add android && npx cap sync android
      - name: Apply Casapi launcher icon
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = "android/app/src/main/res"
          shutil.rmtree(f"{res}/mipmap-anydpi-v26", ignore_errors=True)
          src = Image.open("www/icons/icon-1024.png").convert("RGBA")
          for d, s in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              for name in ("ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"):
                  p = f"{res}/mipmap-{d}/{name}"
                  if os.path.exists(p):
                      src.resize((s, s), Image.LANCZOS).save(p)
          PY
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Casapi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
